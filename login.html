<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | RUDR PROPERTIES</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Poppins",Arial,sans-serif;background:#4a6cf7;color:#fff;min-height:100vh;display:grid;place-items:center;padding:20px;overflow-x:hidden}
.stage{display:flex;align-items:flex-end;justify-content:center;gap:28px;width:100%;max-width:760px}

/* Character */
.char-wrap{position:relative;width:130px;height:270px;flex:none}
#char{position:absolute;inset:0}
#char svg{width:100%;height:100%;overflow:visible}
.shadow{position:absolute;left:18px;bottom:-6px;width:94px;height:14px;border-radius:50%;background:rgba(0,0,0,.18);filter:blur(3px)}
.part{transform-box:fill-box;transform-origin:50% 6%}
.walking .legL{animation:swA .6s ease-in-out infinite alternate}
.walking .legR{animation:swB .6s ease-in-out infinite alternate}
.walking .armL{animation:swB .6s ease-in-out infinite alternate}
.walking .armR{animation:swA .6s ease-in-out infinite alternate}
.walking .bodyg{animation:bob .3s ease-in-out infinite alternate}
@keyframes swA{from{transform:rotate(-26deg)}to{transform:rotate(26deg)}}
@keyframes swB{from{transform:rotate(26deg)}to{transform:rotate(-26deg)}}
@keyframes bob{to{transform:translateY(-4px)}}
.armR{transition:transform .55s cubic-bezier(.34,1.56,.64,1)}
.pull .armR{transform:rotate(-125deg)}
#case{position:absolute;left:-30px;bottom:-4px;width:38px;opacity:0}
#handcase{transition:opacity .1s}

/* Form card */
.card{width:100%;max-width:400px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:18px;padding:26px;box-shadow:0 24px 60px rgba(10,20,80,.35);opacity:0;transform:translateY(-140px) scale(.9);transition:opacity .5s,transform .8s cubic-bezier(.34,1.56,.64,1)}
.card.in{opacity:1;transform:none}
.card > *{opacity:0;transform:translateY(12px);transition:opacity .5s,transform .5s}
.card.in > *{opacity:1;transform:none}
.card.in > :nth-child(1){transition-delay:.35s}.card.in > :nth-child(2){transition-delay:.45s}.card.in > :nth-child(3){transition-delay:.55s}.card.in > :nth-child(4){transition-delay:.65s}.card.in > :nth-child(5){transition-delay:.75s}
h1{font-size:25px;font-weight:700}
.sub{margin-top:6px;font-size:14px;line-height:1.5;color:#e4e9ff}
label{display:block;margin:18px 0 7px;font-size:14px}
input{width:100%;padding:13px;border-radius:10px;border:2px solid transparent;background:#fff;color:#111827;font-size:16px;font-family:inherit;transition:border-color .25s,box-shadow .25s}
input:focus{outline:none;border-color:#d6ad60;box-shadow:0 0 0 4px rgba(214,173,96,.35)}
button{width:100%;padding:13px;margin-top:16px;border:0;border-radius:10px;background:#1fa85a;color:#fff;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;position:relative;transition:transform .2s,box-shadow .2s,opacity .2s}
button:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.25)}
button:disabled{opacity:.7}
button.loading{color:transparent}
button.loading::after{content:"";position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#otpForm:not([hidden]){animation:otpIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes otpIn{from{opacity:0;transform:translateY(-12px)}}
#message{margin-top:16px;font-size:14px;line-height:1.5;overflow-wrap:anywhere;color:#fff}
.back{display:inline-block;margin-top:14px;color:#ffe6a8;font-size:14px}
.card.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}

@media (max-width:640px){
  .stage{flex-direction:column;align-items:center;gap:14px}
  .char-wrap{width:90px;height:187px}
  .card{padding:22px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stage">
  <div class="char-wrap" aria-hidden="true">
    <div class="shadow"></div>
    <div id="char">
      <svg viewBox="0 0 120 270">
        <g class="bodyg">
          <g class="part legL"><rect x="47" y="150" width="18" height="88" rx="9" fill="#2b2f3a"/><path d="M42 236h26v10q0 6-6 6H46q-6 0-6-6z" fill="#161616"/></g>
          <g class="part legR"><rect x="66" y="150" width="18" height="88" rx="9" fill="#2b2f3a"/><path d="M62 236h26v10q0 6-6 6H66q-6 0-6-6z" fill="#161616"/></g>
          <rect x="38" y="82" width="46" height="80" rx="16" fill="#b9bcc4"/>
          <rect x="56" y="84" width="10" height="70" rx="4" fill="#f4f4f6"/>
          <g class="part armL"><rect x="26" y="88" width="14" height="66" rx="7" fill="#b9bcc4"/><circle cx="33" cy="157" r="8" fill="#f1c9a5"/>
            <g id="handcase"><rect x="14" y="160" width="32" height="24" rx="4" fill="#6b3f1d"/><path d="M24 160v-6h12v6" stroke="#3b2210" stroke-width="3" fill="none"/></g></g>
          <g class="part armR"><rect x="82" y="88" width="14" height="66" rx="7" fill="#b9bcc4"/><circle cx="89" cy="157" r="8" fill="#f1c9a5"/></g>
          <rect x="53" y="68" width="16" height="18" rx="6" fill="#f1c9a5"/>
          <circle cx="61" cy="50" r="25" fill="#f1c9a5"/>
          <path d="M35 50Q36 20 62 22Q88 22 87 50Q78 34 61 36Q44 36 35 50Z" fill="#e8b93f"/>
          <circle cx="52" cy="53" r="2.6" fill="#222"/><circle cx="70" cy="53" r="2.6" fill="#222"/>
          <path d="M53 63q8 7 16 0" stroke="#a5543a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        </g>
      </svg>
    </div>
    <svg id="case" viewBox="0 0 38 34"><rect x="2" y="9" width="34" height="24" rx="4" fill="#6b3f1d"/><path d="M12 9V3h14v6" stroke="#3b2210" stroke-width="3" fill="none"/></svg>
  </div>

  <main class="card" id="card">
    <h1>RUDR PROPERTIES</h1>
    <p class="sub">पूरी प्रॉपर्टी जानकारी देखने के लिए अपने ईमेल से लॉगिन करें।</p>
    <div>
      <form id="emailForm">
        <label for="email">ईमेल एड्रेस</label>
        <input id="email" type="email" autocomplete="email" placeholder="आपका ईमेल" required>
        <button id="sendButton" type="submit">OTP भेजें</button>
      </form>
      <form id="otpForm" hidden>
        <label for="otp">ईमेल पर आया 6 अंकों का OTP</label>
        <input id="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="123456" required>
        <button id="verifyButton" type="submit">OTP सत्यापित करें</button>
      </form>
    </div>
    <p id="message" role="status" aria-live="polite">लॉगिन सिस्टम शुरू हो रहा है...</p>
    <a class="back" href="./index.html">← वेबसाइट पर वापस जाएँ</a>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script>
/* ===== Intro animation: walk in, drop briefcase, pull the form in ===== */
(() => {
  const char = document.getElementById('char');
  const wrap = char.parentElement;
  const card = document.getElementById('card');
  const hand = document.getElementById('handcase');
  const cs = document.getElementById('case');
  const still = () => { hand.style.opacity = 0; cs.style.opacity = 1; card.classList.add('in'); };
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return still();

  const mobile = matchMedia('(max-width:640px)').matches;
  const from = mobile ? 'translateX(-60vw)' : 'translateX(-55vw)';
  wrap.classList.add('walking');
  char.animate([{ transform: from }, { transform: 'none' }], { duration: 2600, easing: 'linear', fill: 'backwards' })
    .onfinish = () => {
      wrap.classList.remove('walking');
      hand.style.opacity = 0;
      cs.animate([{ transform: 'translateY(-110px)', opacity: 1 }, { transform: 'translateY(0)', opacity: 1 }],
        { duration: 450, easing: 'cubic-bezier(.5,0,1,.6)', fill: 'forwards' });
      cs.style.opacity = 1;
      setTimeout(() => { wrap.classList.add('pull'); }, 600);
      setTimeout(() => { card.classList.add('in'); }, 900);
      setTimeout(() => { wrap.classList.remove('pull'); }, 2000);
    };
})();

/* ===== Login logic (Supabase OTP) ===== */
(() => {
  const form = document.getElementById('emailForm');
  const otpForm = document.getElementById('otpForm');
  const emailInput = document.getElementById('email');
  const otpInput = document.getElementById('otp');
  const message = document.getElementById('message');
  const sendButton = document.getElementById('sendButton');
  const verifyButton = document.getElementById('verifyButton');
  const card = document.getElementById('card');

  function shake() { card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); }
  function showError(prefix, error) {
    shake();
    message.textContent = prefix + (error && error.message ? error.message : 'अज्ञात त्रुटि');
  }

  try {
    const cfg = window.RUDR_CONFIG;
    if (!cfg || !cfg.SUPABASE_URL || !cfg.SUPABASE_PUBLISHABLE_KEY) {
      throw new Error('config.js में Supabase URL या Publishable Key नहीं मिली।');
    }
    if (!window.supabase || !window.supabase.createClient) {
      throw new Error('Supabase लाइब्रेरी लोड नहीं हुई। इंटरनेट कनेक्शन जाँचें।');
    }
    const client = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_PUBLISHABLE_KEY);

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const email = emailInput.value.trim();
      if (!email) { message.textContent = 'कृपया अपना ईमेल डालें।'; return; }
      sendButton.disabled = true;
      sendButton.classList.add('loading');
      message.textContent = 'OTP भेजा जा रहा है...';
      try {
        const { error } = await client.auth.signInWithOtp({ email, options: { shouldCreateUser: true } });
        if (error) throw error;
        otpForm.hidden = false;
        message.textContent = 'OTP भेजने का अनुरोध सफल हुआ। अपना Inbox और Spam/Junk फ़ोल्डर जाँचें।';
        otpInput.focus();
      } catch (error) {
        showError('OTP नहीं भेजा जा सका: ', error);
      } finally {
        sendButton.disabled = false;
        sendButton.classList.remove('loading');
      }
    });

    otpForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      verifyButton.disabled = true;
      verifyButton.classList.add('loading');
      message.textContent = 'OTP सत्यापित किया जा रहा है...';
      try {
        const { error } = await client.auth.verifyOtp({
          email: emailInput.value.trim(),
          token: otpInput.value.trim(),
          type: 'email'
        });
        if (error) throw error;
        message.textContent = 'लॉगिन सफल! वेबसाइट खोली जा रही है...';
        window.location.replace('./index.html');
      } catch (error) {
        showError('OTP सत्यापित नहीं हुआ: ', error);
      } finally {
        verifyButton.disabled = false;
        verifyButton.classList.remove('loading');
      }
    });

    message.textContent = 'ईमेल से लॉगिन करने के लिए तैयार।';
  } catch (error) {
    showError('लॉगिन सिस्टम शुरू नहीं हुआ: ', error);
    sendButton.disabled = true;
  }
})();
</script>
</body>
</html>
