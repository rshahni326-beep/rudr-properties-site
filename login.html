<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | RUDR PROPERTIES</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .box {
      width: 100%;
      max-width: 420px;
      background: #1d293b;
      border: 1px solid #35445a;
      border-radius: 18px;
      padding: 26px;
    }
    h1 { font-size: 25px; margin: 0 0 8px; }
    p { color: #cbd5e1; line-height: 1.5; }
    label { display: block; margin: 18px 0 7px; }
    input {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #64748b;
      background: #0f172a;
      color: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 13px;
      margin-top: 16px;
      border: 0;
      border-radius: 9px;
      background: #d6ad60;
      color: #111827;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    #message { overflow-wrap: anywhere; }
    a { color: #f5d48a; }
    .back { display: inline-block; margin-top: 16px; }
  </style>
</head>
<body>
  <main class="box">
    <h1>RUDR PROPERTIES</h1>
    <p>पूरी प्रॉपर्टी जानकारी देखने के लिए अपने ईमेल से लॉगिन करें।</p>

    <form id="emailForm">
      <label for="email">ईमेल एड्रेस</label>
      <input id="email" type="email" autocomplete="email"
             placeholder="आपका ईमेल" required>
      <button id="sendButton" type="submit">OTP भेजें</button>
    </form>

    <form id="otpForm" hidden>
      <label for="otp">ईमेल पर आया 6 अंकों का OTP</label>
      <input id="otp" inputmode="numeric" autocomplete="one-time-code"
             pattern="[0-9]{6}" maxlength="6" placeholder="123456" required>
      <button id="verifyButton" type="submit">OTP सत्यापित करें</button>
    </form>

    <p id="message" role="status"></p>
    <a class="back" href="./index.html">← वेबसाइट पर वापस जाएँ</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script>
    const form = document.getElementById('emailForm');
    const otpForm = document.getElementById('otpForm');
    const emailInput = document.getElementById('email');
    const otpInput = document.getElementById('otp');
    const message = document.getElementById('message');
    const sendButton = document.getElementById('sendButton');
    const verifyButton = document.getElementById('verifyButton');

    const cfg = window.RUDR_CONFIG;
    if (!cfg || !cfg.SUPABASE_URL || !cfg.SUPABASE_PUBLISHABLE_KEY) {
      message.textContent = 'सेटिंग नहीं मिली। कृपया वेबसाइट एडमिन से संपर्क करें।';
      sendButton.disabled = true;
      throw new Error('Supabase configuration missing');
    }

    const supabase = window.supabase.createClient(
      cfg.SUPABASE_URL,
      cfg.SUPABASE_PUBLISHABLE_KEY
    );

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      sendButton.disabled = true;
      message.textContent = 'OTP भेजा जा रहा है...';

      try {
        const { error } = await supabase.auth.signInWithOtp({
          email: emailInput.value.trim(),
          options: { shouldCreateUser: true }
        });
        if (error) throw error;

        otpForm.hidden = false;
        message.textContent =
          'यदि OTP आया है, तो अपने ईमेल में उसे देखें। Spam/Junk फ़ोल्डर भी जाँचें।';
        otpInput.focus();
      } catch (error) {
        message.textContent = 'OTP नहीं भेजा जा सका: ' + error.message;
      } finally {
        sendButton.disabled = false;
      }
    });

    otpForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      verifyButton.disabled = true;
      message.textContent = 'OTP जाँचा जा रहा है...';

      try {
        const { error } = await supabase.auth.verifyOtp({
          email: emailInput.value.trim(),
          token: otpInput.value.trim(),
          type: 'email'
        });
        if (error) throw error;

        message.textContent = 'लॉगिन सफल! वेबसाइट खोली जा रही है...';
        window.location.replace('./index.html');
      } catch (error) {
        message.textContent =
          'OTP सत्यापित नहीं हुआ: ' + error.message;
      } finally {
        verifyButton.disabled = false;
      }
    });
  </script>
</body>
</html>
