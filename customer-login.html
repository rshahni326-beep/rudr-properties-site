    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      background: var(--page);
    }

    body {
      margin: 0;
      color: var(--ink);
      font-family: 'FreeSans', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: var(--page);
    }

    .photo {
      position: absolute;
      left: 0;
      top: 0;
      width: 57.1038%;
      height: 100%;
      overflow: hidden;
      background: #35383c center / cover no-repeat;
    }

    .photo-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 100% 50%;
      display: block;
      -webkit-user-drag: none;
      background: #35383c;
    }

    .photo-img--wide {
      display: none;
    }

    .scrim {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .hero {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 836px;
      height: 949px;
      transform-origin: left bottom;
      pointer-events: none;
      z-index: 3;
    }

    .hero > * {
      pointer-events: auto;
    }

    .badge {
      position: absolute;
      left: var(--badge-left);
      top: var(--badge-top);
      height: 37px;
      padding: 0 16px 0 19px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: var(--badge-gap);
      background: var(--badge-bg);
      color: #fff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.18), 0 6px 18px rgba(0, 0, 0, 0.14);
      -webkit-backdrop-filter: blur(7px) saturate(120%);
      backdrop-filter: blur(7px) saturate(120%);
      white-space: nowrap;
      font-size: var(--badge-fs);
      font-weight: var(--badge-fw);
      letter-spacing: var(--badge-ls);
      word-spacing: var(--badge-ws);
      line-height: 1;
    }

    .badge svg {
      width: 17px;
      height: 16.27px;
      position: relative;
      top: -1px;
      flex: 0 0 auto;
    }

    .hl-wrap {
      position: absolute;
      inset: 0;
    }

    .hl {
      position: absolute;
      display: block;
      color: var(--ink);
      font-family: 'Eloquia', 'FreeSans', sans-serif;
      font-variation-settings: 'wght' var(--hl-wght);
      font-weight: 600;
      line-height: var(--hl-lh);
      white-space: nowrap;
    }

    #hl1 {
      left: var(--hl1-left);
      top: var(--hl1-top);
      font-size: var(--hl1-fs);
      letter-spacing: var(--hl1-ls);
      word-spacing: var(--hl1-ws);
    }

    #hl2 {
      left: var(--hl2-left);
      top: var(--hl2-top);
      font-size: var(--hl2-fs);
      letter-spacing: var(--hl2-ls);
    }

    .pane {
      position: absolute;
      left: 57.1038%;
      right: 0;
      top: 0;
      bottom: 0;
      overflow: hidden;
    }

    .card {
      position: absolute;
      left: 1px;
      top: 14px;
      width: 613px;
      height: 922px;
      overflow: hidden;
      border-radius: 26px;
      background: rgba(254, 254, 254, 0.90);
      border: 1px solid rgba(0, 0, 0, 0.036);
      box-shadow: var(--card-shadow);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      backdrop-filter: blur(28px) saturate(160%);
      z-index: 4;
    }

    .card-in {
      position: absolute;
      left: 0;
      top: 0;
      width: 613px;
      height: 922px;
      transform-origin: left top;
    }

      position: absolute;
      left: 62px;
      width: 488px;
    }

      top: var(--h1-top);

      font-family: 'Eloquia', 'FreeSans', sans-serif;
      font-size: var(--h1-fs);

      font-weight: 600;
      letter-spacing: var(--h1-ls);
      word-spacing: var(--h1-ws);

  <script>
    (function () {
      'use strict';

      var REF_W = 1464;
      var REF_H = 949;
      var PHOTO_W = 836;
      var PANE_W = 628;
      var CARD_W = 613;
      var CARD_H = 922;
      var CONTENT_H = 697;
      var IMG_W = 1177;
      var IMG_H = 1336;
      var IMG_REF_SCALE = 836 / 1177;
      var PANE_RATIO = PANE_W / REF_W;
      var HERO_W = 681;
      var HERO_H = 219;
      var REF_CARD_ASPECT = 692 / 855;
      var RAMP_HI = 1280;
      var RAMP_LO = 1000;
      var PHOTO_MIN = 0.42;
      var RAMP_LO2 = 820;
      var PHOTO_MIN2 = 0.36;
      var TP = {
        pad: 0.1076,
        h1Top: 0.08656,
        h1Fs: 0.06839,
        subTop: 0.17368,
        subFs: 0.0309,
        emTop: 0.25435,
        emH: 0.10257,
        emR: 0.0202,
        ephFs: 0.02702,
        ephPad: 0.0332,

        pwH: 0.10839,
        pphFs: 0.02972,
        pphPad: 0.0332,
        btnTop: 0.50435,
        btnH: 0.10981,
        btnFs: 0.0275,
        arrow: 0.026,
        btnGap: 0.02,
        divTop: 0.68222,
        orFs: 0.02245,
        orPad: 0.051,
        divH: 0.0026,
        gTop: 0.76445,
        gH: 0.09966,
        gIcon: 0.032,

        btFs: 0.02876,
        badgeH: 0.0742,
        heroFs: 0.1058,
        heroLh: 1.1246,
        heroBot: 0.06493,
        heroGap: -0.30423,
        heroSide: 0.0525
      };

      var mqLandscape = window.matchMedia('(min-width:700px) and (min-aspect-ratio:51/50)');
      var mqPortrait = window.matchMedia('(min-width:700px) and (max-aspect-ratio:51/50)');
      var photo = document.querySelector('.photo');
      var pane = document.querySelector('.pane');
      var card = document.getElementById('card');
      var cardIn = document.getElementById('cardIn');
      var hero = document.getElementById('hero');
      var headline = document.querySelector('.hl-wrap');
      var root = document.documentElement;
      var headlineFirst = document.getElementById('hl1');
      var headlineSecond = document.getElementById('hl2');

      function clearInline() {
        [photo, pane, card, cardIn, hero].forEach(function (element) {
          element.style.cssText = '';
        });
      }

      function setMode(mode) {
        document.body.classList.toggle('tabport', mode === 'tabport');
        document.body.classList.toggle('stacked', mode === 'phone');
        document.body.dataset.mode = mode;
        if (mode === 'land') {
          headlineFirst.textContent = 'Find Your Dream Place';
          headlineSecond.textContent = 'With Confidence';
        } else if (mode === 'phone') {
          headlineFirst.textContent = 'Find Your';
          headlineSecond.innerHTML = 'Dream<br>Home';
        } else {
          headlineFirst.textContent = 'Find Your Dream';
          headlineSecond.textContent = 'Place With Confidence';
        }
      }

      function photoRatio(vw) {
        if (vw >= RAMP_HI) {
          return 1 - PANE_RATIO;
        }
        if (vw >= RAMP_LO) {
          return PHOTO_MIN + (vw - RAMP_LO) / (RAMP_HI - RAMP_LO) * ((1 - PANE_RATIO) - PHOTO_MIN);
        }
        if (vw >= RAMP_LO2) {
          return PHOTO_MIN2 + (vw - RAMP_LO2) / (RAMP_LO - RAMP_LO2) * (PHOTO_MIN - PHOTO_MIN2);
        }
        return PHOTO_MIN2;
      }

      function placeCard(paneW, vh) {
        var cs = Math.min(paneW / PANE_W, vh / CONTENT_H);
        var gapL = 1 * cs;
        var marginTop = 14 * cs;
        var marginBottom = 13 * cs;
        var marginRight = 14 * cs;
        var cw = Math.max(CARD_W * cs, paneW - gapL - marginRight);
        var ch = vh - marginTop - marginBottom;
        card.style.left = gapL + 'px';
        card.style.top = marginTop + 'px';
        card.style.width = cw + 'px';
        card.style.height = ch + 'px';
        card.style.borderRadius = (26 * cs) + 'px';
        card.style.borderWidth = Math.max(1, cs) + 'px';
        cardIn.style.width = CARD_W + 'px';
        cardIn.style.height = CARD_H + 'px';
        cardIn.style.transform = 'translate(' + ((cw - CARD_W * cs) / 2) + 'px, 0) scale(' + cs + ')';
      }

      function seatHero(photoW, vh) {
        var imgScale = Math.max(photoW / IMG_W, vh / IMG_H);
        var s = Math.min(imgScale / IMG_REF_SCALE, photoW * 0.92 / HERO_W);
        hero.style.width = PHOTO_W + 'px';
        hero.style.height = REF_H + 'px';
        hero.style.transform = 'scale(' + s + ')';
        hero.style.bottom = '0px';
        hero.style.left = '0px';
      }

      function headlineMeasure() {
        var probe = document.createElement('span');
        var style = window.getComputedStyle(document.getElementById('hl1'));
        probe.textContent = 'Find Your Dream Place With Confidence';
        probe.style.position = 'absolute';
        probe.style.visibility = 'hidden';
        probe.style.whiteSpace = 'nowrap';
        probe.style.fontFamily = style.fontFamily;
        probe.style.fontSize = style.fontSize;
        probe.style.fontWeight = style.fontWeight;
        probe.style.letterSpacing = style.letterSpacing;
        probe.style.wordSpacing = style.wordSpacing;
        probe.style.fontVariationSettings = style.fontVariationSettings;
        document.body.appendChild(probe);
        var width = probe.getBoundingClientRect().width;
        probe.remove();
        return width;
      }

      function setTabletVars(vw, vh, band, footer) {
        var cardW = vw;
        var cardH = vh - band - footer;
        var s = Math.min(cardH, cardW * REF_CARD_ASPECT);
        root.style.setProperty('--band-h', band + 'px');
        root.style.setProperty('--footer-h', footer + 'px');
        root.style.setProperty('--tp-card-w', cardW + 'px');
        root.style.setProperty('--tp-card-h', cardH + 'px');
        root.style.setProperty('--tp-s', s + 'px');
        root.style.setProperty('--tp-pad', Math.round(cardW * TP.pad) + 'px');
        root.style.setProperty('--badge-k', (band * TP.badgeH / 37).toFixed(4));
        root.style.setProperty('--hero-side', Math.round(vw * TP.heroSide) + 'px');
        root.style.setProperty('--hero-b', Math.round(band * TP.heroBot) + 'px');
        root.style.setProperty('--hero-gap', Math.round(band * TP.heroGap) + 'px');
        root.style.setProperty('--headline-measure', Math.round(headlineMeasure() * 0.61) + 'px');
        Object.keys(TP).forEach(function (key) {
          var kebab = key.replace(/[A-Z]/g, function (letter) { return '-' + letter.toLowerCase(); });
          root.style.setProperty('--tp-' + kebab, TP[key]);
        });
        root.style.setProperty('--tp-pad', Math.round(cardW * TP.pad) + 'px');
      }

      function layout() {
        var vw = window.innerWidth;
        var vh = window.innerHeight;
        clearInline();
        if (vw < 700) {
          setMode('phone');
          return;
        }
        if (mqPortrait.matches) {
          setMode('tabport');
          var band = Math.round(vh * 0.425);
          var footer = Math.round(vh * 0.0297);
          setTabletVars(vw, vh, band, footer);
          photo.style.width = '100%';
          photo.style.height = band + 'px';
          pane.style.top = band + 'px';
          pane.style.height = (vh - band) + 'px';
          card.style.top = footer + 'px';
          card.style.height = (vh - band - footer) + 'px';
          cardIn.style.width = '100%';
          cardIn.style.height = (vh - band - footer) + 'px';
          hero.style.left = Math.round(vw * TP.heroSide) + 'px';
          hero.style.bottom = Math.round(band * TP.heroBot) + 'px';
          return;
        }
        setMode('land');
        var ratio = photoRatio(vw);
        var photoW = vw * ratio;
        var paneW = vw - photoW;
        photo.style.width = photoW + 'px';
        photo.style.height = vh + 'px';
        pane.style.left = photoW + 'px';
        pane.style.width = paneW + 'px';
        pane.style.height = vh + 'px';
        placeCard(paneW, vh);
        seatHero(photoW, vh);
      }

      [mqLandscape, mqPortrait].forEach(function (query) {
        if (query.addEventListener) {
          query.addEventListener('change', layout);
        } else {
          query.addListener(layout);
        }
      });
      window.addEventListener('resize', layout, { passive: true });
      window.addEventListener('orientationchange', layout, { passive: true });
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(layout);
      }
      layout();
    }());
  </script>

  <script>
    (function () {
      'use strict';

      var animations = [];
      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var compact = window.matchMedia('(max-width:699px)').matches;
      var ease = 'cubic-bezier(.16,1,.3,1)';
      var softEase = 'cubic-bezier(.22,1,.36,1)';

      function releaseEntrance() {
        document.documentElement.classList.remove('entry-pending');
        if (window.__entryFallback) {
          clearTimeout(window.__entryFallback);
        }
      }

      function animateElement(selector, delay, duration, easing, from) {
        var element = document.querySelector(selector);
        if (!element) {
          return;
        }
        var animation = element.animate([
          Object.assign({ opacity: 0 }, from),
          { opacity: 1, transform: 'none', clipPath: 'inset(0 0 0 0)' }
        ], {
          delay: delay,
          duration: duration,
          easing: easing,
          fill: 'both'
        });
        animations.push(animation);
      }

      if (reduced || !Element.prototype.animate) {
        releaseEntrance();
        return;
      }

      Promise.race([
        document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve(),
        new Promise(function (resolve) { setTimeout(resolve, 650); })
      ]).then(function () {
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            animateElement('.card', 40, 820, ease, { transform: compact ? 'translateY(14px)' : 'translateY(12px) scale(.988)' });
            animateElement('.badge', 120, 480, softEase, { transform: 'translateY(8px)' });
            animateElement('#hl1', 240, 760, ease, { transform: 'translateY(' + (compact ? 12 : 16) + 'px)', clipPath: 'inset(100% 0 0 0)' });
            animateElement('#hl2', 330, 760, ease, { transform: 'translateY(' + (compact ? 12 : 16) + 'px)', clipPath: 'inset(100% 0 0 0)' });
            animateElement('#h1', 470, 620, ease, { transform: 'translateY(10px)' });
            animateElement('#sub', 570, 560, ease, { transform: 'translateY(10px)' });
            animateElement('#email', 720, 520, softEase, { transform: 'translateY(8px)' });
            animateElement('#pw', 790, 520, softEase, { transform: 'translateY(8px)' });
            animateElement('#loginBtn', 930, 560, ease, { transform: 'translateY(8px)' });
            animateElement('.divider', 1060, 440, softEase, { transform: 'translateY(6px)' });
            animateElement('#gBtn', 1150, 540, ease, { transform: 'translateY(8px)' });
            animateElement('#bottom', 1260, 500, softEase, { transform: 'translateY(6px)' });
            document.documentElement.classList.remove('entry-pending');
            Promise.allSettled(animations.map(function (animation) { return animation.finished; })).then(function () {
              animations.forEach(function (animation) { animation.cancel(); });
              animations = [];
              releaseEntrance();
            });
          });
        });
      });
    }());
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script>
    (function () {
      'use strict';
      var $ = function (q) { return document.querySelector(q); };
      var emailIn = $('#email input'), otpIn = $('#pw input'), btn = $('#loginBtn');
      var btnTxt = btn.querySelector('span'), back = $('#backLink'), gBtn = $('#gBtn'), msg = $('#statusTxt');
      var embedded = window.parent !== window;
      var DEFAULT = 'We\u2019ll email you a one-time code.';
      var step = 1, client = null;

      function say(t, err) {
        msg.textContent = t.length > 60 ? t.slice(0, 57) + '\u2026' : t;
        msg.style.color = err ? '#c0392b' : '';
      }
      function shake() {
        var c = $('#card');
        if (c.animate) { c.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-9px)' }, { transform: 'translateX(9px)' }, { transform: 'translateX(-6px)' }, { transform: 'translateX(0)' }], { duration: 380 }); }
      }
      function busy(on, label) {
        btn.disabled = on;
        btn.style.opacity = on ? '.75' : '';
        if (label) { btnTxt.textContent = label; }
      }
      function label() { return step === 1 ? 'Send OTP' : 'Verify & Login'; }

      try {
        var cfg = window.RUDR_CONFIG;
        if (!cfg || !cfg.SUPABASE_URL || !cfg.SUPABASE_PUBLISHABLE_KEY || !window.supabase) { throw new Error('config'); }
        client = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_PUBLISHABLE_KEY);
      } catch (e) { say('Login is not available right now.', true); }

      emailIn.addEventListener('input', function () {
        if (step === 2) { step = 1; otpIn.value = ''; btnTxt.textContent = label(); say(DEFAULT); }
      });
      [emailIn, otpIn].forEach(function (el) {
        el.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); btn.click(); } });
      });

      btn.addEventListener('click', async function () {
        if (!client) { say('Login is not available right now.', true); return; }
        var email = emailIn.value.trim();
        if (step === 1) {
          if (!/^\S+@\S+\.\S+$/.test(email)) { say('Please enter a valid email address.', true); shake(); emailIn.focus(); return; }
          busy(true, 'Sending\u2026');
          try {
            var r = await client.auth.signInWithOtp({ email: email, options: { shouldCreateUser: true } });
            if (r.error) { throw r.error; }
            step = 2; say('Code sent. Please check Inbox and Spam.'); otpIn.focus();
          } catch (err) { say(err.message || 'Could not send the code.', true); shake(); }
          busy(false, label());
        } else {
          var code = otpIn.value.trim();
          if (!/^\d{6}$/.test(code)) { say('Please enter the 6-digit code.', true); shake(); otpIn.focus(); return; }
          busy(true, 'Verifying\u2026');
          try {
            var v = await client.auth.verifyOtp({ email: email, token: code, type: 'email' });
            if (v.error) { throw v.error; }
            say('Login successful!');
            if (embedded) { window.parent.location.reload(); } else { window.location.replace('./index.html'); }
            return;
          } catch (err2) { say(err2.message || 'That code is not valid.', true); shake(); }
          busy(false, label());
        }
      });

      gBtn.addEventListener('click', async function () {
        if (!client) { say('Login is not available right now.', true); return; }
        gBtn.disabled = true;
        try {
          var c = window.RUDR_CONFIG, enabled = true;
          try {
            var st = await fetch(c.SUPABASE_URL + '/auth/v1/settings', { headers: { apikey: c.SUPABASE_PUBLISHABLE_KEY } });
            var info = await st.json();
            if (info && info.external && info.external.google === false) { enabled = false; }
          } catch (e0) { /* if the check fails, try anyway */ }
          if (!enabled) { say('Google login is not enabled yet.', true); shake(); gBtn.disabled = false; return; }
          var target = new URL('./index.html', window.location.href).href;
          var r = await client.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: target, skipBrowserRedirect: true } });
          if (r.error) { throw r.error; }
          if (!r.data || !r.data.url) { throw new Error('Could not start Google login.'); }
          say('Opening Google\u2026');
          (embedded ? window.top : window).location.href = r.data.url;
        } catch (e3) { say(e3.message || 'Google login failed.', true); shake(); gBtn.disabled = false; }
      });

      back.addEventListener('click', function (e) {
        e.preventDefault();
        if (embedded) { window.parent.postMessage('rudr-close', '*'); } else { window.location.href = './index.html'; }
      });
      window.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && embedded) { window.parent.postMessage('rudr-close', '*'); }
      });
    }());
  </script>
