<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a1b33">
<title>Customer Login | RUDR PROPERTIES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#d6ad60;--gold2:#f1d28f;--ink:#06132a}
body{font-family:"Inter",system-ui,sans-serif;color:#fff;min-height:100vh;display:grid;place-items:center;padding:24px 18px;overflow-x:hidden;position:relative;
  background:radial-gradient(900px 520px at 68% 42%,rgba(214,173,96,.2),transparent 65%),radial-gradient(700px 500px at 12% 90%,rgba(60,110,200,.3),transparent 60%),linear-gradient(160deg,#10294a,#06132a 70%)}
.skyline{position:fixed;left:0;right:0;bottom:0;width:100%;height:34vh;pointer-events:none;opacity:.9}
.dot{position:fixed;border-radius:50%;background:var(--gold2);pointer-events:none;opacity:0;animation:floaty linear infinite}
@keyframes floaty{0%{transform:translateY(0);opacity:0}15%{opacity:.55}100%{transform:translateY(-70vh);opacity:0}}
.stage{position:relative;z-index:2;display:flex;align-items:flex-end;justify-content:center;gap:34px;width:100%;max-width:820px}

/* ---------- Character ---------- */
.char-wrap{position:relative;width:168px;height:360px;flex:none}
#char{position:absolute;inset:0;filter:drop-shadow(0 14px 18px rgba(0,0,0,.45))}
#char svg{width:100%;height:100%;overflow:visible}
.shadow{position:absolute;left:12%;bottom:-8px;width:76%;height:16px;border-radius:50%;background:rgba(0,0,0,.55);filter:blur(5px)}
.floor{position:absolute;left:-60px;right:-60px;bottom:-4px;height:2px;background:linear-gradient(90deg,transparent,rgba(214,173,96,.5),transparent)}
.legL{transform-origin:62px 168px}.legR{transform-origin:84px 168px}
.armL{transform-origin:40px 92px}.armR{transform-origin:100px 92px}
.walking .legL,.walking .armR{animation:swA .62s ease-in-out infinite alternate}
.walking .legR,.walking .armL{animation:swB .62s ease-in-out infinite alternate}
.walking .bodyg{animation:bob .31s ease-in-out infinite alternate}
@keyframes swA{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
@keyframes swB{from{transform:rotate(24deg)}to{transform:rotate(-24deg)}}
@keyframes bob{to{transform:translateY(-4px)}}
.armR{transition:transform .6s cubic-bezier(.34,1.56,.64,1)}
.pull .armR{transform:rotate(-128deg)}
.idle .bodyg{animation:breathe 3s ease-in-out infinite alternate}
@keyframes breathe{to{transform:translateY(-2.5px)}}
.eyes{transform-origin:70px 51px;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
#case{position:absolute;left:-46px;bottom:-4px;width:50px;opacity:0;filter:drop-shadow(0 6px 6px rgba(0,0,0,.5))}

/* ---------- Card ---------- */
.card{position:relative;width:100%;max-width:410px;border-radius:22px;padding:30px 28px 26px;
  background:linear-gradient(155deg,rgba(255,255,255,.11),rgba(255,255,255,.03));
  border:1px solid rgba(214,173,96,.38);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 30px 70px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.14);
  opacity:0;transform:translateY(-150px) scale(.9);transition:opacity .5s,transform .9s cubic-bezier(.34,1.56,.64,1)}
.card.in{opacity:1;transform:none;animation:ring 1.4s .5s ease-out}
@keyframes ring{0%{box-shadow:0 30px 70px rgba(0,0,0,.55),0 0 0 0 rgba(214,173,96,.5)}100%{box-shadow:0 30px 70px rgba(0,0,0,.55),0 0 0 36px rgba(214,173,96,0)}}
.card > *{opacity:0;transform:translateY(14px);transition:opacity .55s,transform .55s}
.card.in > *{opacity:1;transform:none}
.card.in > :nth-child(1){transition-delay:.4s}.card.in > :nth-child(2){transition-delay:.5s}.card.in > :nth-child(3){transition-delay:.6s}.card.in > :nth-child(4){transition-delay:.7s}.card.in > :nth-child(5){transition-delay:.8s}
.head{display:flex;align-items:center;gap:14px}
.head img{width:54px;height:54px;object-fit:contain}
.brand{font-family:"Sora",system-ui,sans-serif;font-size:23px;font-weight:700;letter-spacing:.4px;line-height:1.1}
.brand i{font-style:normal;color:var(--gold)}
.tag{display:block;margin-top:3px;font-size:10.5px;letter-spacing:.22em;color:rgba(255,255,255,.55)}
.sub{margin-top:16px;font-size:14.5px;line-height:1.6;color:rgba(255,255,255,.75)}
label{display:block;margin:20px 0 8px;font-size:13px;font-weight:500;color:var(--gold2);letter-spacing:.03em}
input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.16);background:rgba(8,9,8,.55);color:#fff;font-size:16px;font-family:inherit;transition:border-color .25s,box-shadow .25s,background .25s}
input::placeholder{color:rgba(255,255,255,.38)}
input:focus{outline:none;border-color:var(--gold);background:rgba(8,9,8,.75);box-shadow:0 0 0 4px rgba(214,173,96,.22)}
button{position:relative;overflow:hidden;width:100%;padding:14px;margin-top:18px;border:0;border-radius:12px;background:linear-gradient(135deg,#f1d28f,#c9993f 55%,#b98a35);color:#1a1409;font-size:16px;font-weight:700;font-family:inherit;letter-spacing:.02em;cursor:pointer;box-shadow:0 10px 24px rgba(185,138,53,.35);transition:transform .2s,box-shadow .2s,opacity .2s}
button::before{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 3.6s 1.5s infinite}
@keyframes shine{0%,60%{left:-70%}100%{left:130%}}
button:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(185,138,53,.5)}
button:active{transform:scale(.98)}
button:disabled{opacity:.75}
button.loading{color:transparent}
button.loading::after{content:"";position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border:3px solid rgba(26,20,9,.25);border-top-color:#1a1409;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#otpForm:not([hidden]){animation:otpIn .55s cubic-bezier(.2,.8,.2,1)}
@keyframes otpIn{from{opacity:0;transform:translateY(-14px)}}
#message{margin-top:18px;font-size:13.5px;line-height:1.55;color:rgba(255,255,255,.8);overflow-wrap:anywhere}
.back{display:inline-block;margin-top:14px;font-size:13.5px;color:var(--gold2);text-decoration:none;border-bottom:1px solid rgba(241,210,143,.35);padding-bottom:1px;transition:color .2s}
.back:hover{color:#fff}
.card.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}

@media (max-width:640px){
  .stage{flex-direction:column;align-items:center;gap:20px}
  .char-wrap{width:112px;height:240px}
  #case{left:-34px;width:38px}
  .card{padding:24px 20px 22px}
  .skyline{height:22vh}
}
html.embedded body{background:transparent}html.embedded .skyline{display:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.dot{display:none}}
</style>
</head>
<body>
<svg class="skyline" viewBox="0 0 1200 300" preserveAspectRatio="none" aria-hidden="true">
  <g fill="rgba(214,173,96,.07)"><rect x="40" y="170" width="70" height="130"/><rect x="120" y="120" width="60" height="180"/><rect x="190" y="190" width="90" height="110"/><rect x="300" y="90" width="70" height="210"/><rect x="380" y="150" width="100" height="150"/><rect x="500" y="200" width="60" height="100"/><rect x="580" y="110" width="80" height="190"/><rect x="680" y="170" width="70" height="130"/><rect x="770" y="70" width="64" height="230"/><rect x="850" y="140" width="90" height="160"/><rect x="960" y="190" width="70" height="110"/><rect x="1050" y="100" width="70" height="200"/><rect x="1130" y="160" width="60" height="140"/></g>
</svg>

<div class="stage">
  <div class="char-wrap" aria-hidden="true">
    <div class="floor"></div><div class="shadow"></div>
    <div id="char">
      <svg viewBox="0 0 140 300">
        <defs>
          <linearGradient id="gS" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a4868"/><stop offset="1" stop-color="#171d2e"/></linearGradient>
          <linearGradient id="gP" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3248"/><stop offset="1" stop-color="#141827"/></linearGradient>
          <linearGradient id="gK" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8d9b9"/><stop offset="1" stop-color="#e3b189"/></linearGradient>
          <linearGradient id="gG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6dc9f"/><stop offset="1" stop-color="#b98a35"/></linearGradient>
          <linearGradient id="gC" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#94602d"/><stop offset="1" stop-color="#4a2c12"/></linearGradient>
          <linearGradient id="gH" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6a4833"/><stop offset="1" stop-color="#2a1a12"/></linearGradient>
        </defs>
        <g class="bodyg">
          <g class="legL"><rect x="52" y="166" width="20" height="96" rx="9" fill="url(#gP)"/><path d="M47 258h28v12q0 8-9 8H51q-8 0-8-7z" fill="#2a1a12"/><path d="M51 263h15" stroke="#9a7a62" stroke-width="2" stroke-linecap="round"/></g>
          <g class="legR"><rect x="74" y="166" width="20" height="96" rx="9" fill="url(#gP)"/><path d="M69 258h28v12q0 8-9 8H73q-8 0-8-7z" fill="#2a1a12"/><path d="M73 263h15" stroke="#9a7a62" stroke-width="2" stroke-linecap="round"/></g>
          <path d="M38 98q0-14 14-16h36q14 2 14 16l-2 78q-30 10-60 0z" fill="url(#gS)"/>
          <path d="M62 82l8 32 8-32z" fill="#f4f4f6"/>
          <path d="M54 82l14 36-12 26-8-46z" fill="#222b43"/><path d="M86 82L72 118l12 26 8-46z" fill="#222b43"/>
          <rect x="66" y="94" width="8" height="8" rx="2" fill="#d9b46a"/><path d="M67 102h6l3 30-6 9-6-9z" fill="url(#gG)"/>
          <path d="M84 120h11l-1 7h-9z" fill="#f4f4f6"/>
          <circle cx="70" cy="152" r="2" fill="#0e121c"/><circle cx="70" cy="164" r="2" fill="#0e121c"/>
          <rect x="62" y="70" width="16" height="18" rx="6" fill="#dca67b"/>
          <circle cx="47" cy="54" r="5" fill="#eac09a"/><circle cx="93" cy="54" r="5" fill="#eac09a"/>
          <ellipse cx="70" cy="52" rx="23" ry="26" fill="url(#gK)"/>
          <path d="M45 52q-5-34 26-35q31 1 24 35q-4-17-14-21q-16 6-30 3q-4 6-6 18z" fill="url(#gH)"/>
          <path d="M58 24q10-4 22 0" stroke="#7a5a44" stroke-width="2" fill="none" stroke-linecap="round" opacity=".6"/>
          <path d="M54 43q6-3 11-1M75 42q5-2 11 1" stroke="#33231a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <g class="eyes"><ellipse cx="60" cy="51" rx="3.3" ry="3.7" fill="#fff"/><circle cx="60.5" cy="51.6" r="2.3" fill="#2b2118"/><circle cx="61.3" cy="50.7" r=".8" fill="#fff"/><ellipse cx="80" cy="51" rx="3.3" ry="3.7" fill="#fff"/><circle cx="80.5" cy="51.6" r="2.3" fill="#2b2118"/><circle cx="81.3" cy="50.7" r=".8" fill="#fff"/></g>
          <path d="M70 54q-3 6 1 7" stroke="#c78d66" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <path d="M60 65q10 9 20 0" stroke="#a2513a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
          <circle cx="53" cy="62" r="4" fill="#f0a08a" opacity=".3"/><circle cx="87" cy="62" r="4" fill="#f0a08a" opacity=".3"/>
          <g class="armL"><rect x="26" y="88" width="15" height="72" rx="7.5" fill="url(#gS)"/><rect x="26" y="152" width="15" height="6" rx="2" fill="#f4f4f6"/><circle cx="33.5" cy="166" r="8" fill="#f0c6a0"/>
            <g id="handcase"><path d="M26 172v7h15v-7" stroke="#2b1708" stroke-width="3" fill="none"/><rect x="13" y="178" width="41" height="30" rx="4" fill="url(#gC)"/><rect x="29" y="188" width="9" height="6" rx="1.5" fill="url(#gG)"/></g></g>
          <g class="armR"><rect x="99" y="88" width="15" height="72" rx="7.5" fill="url(#gS)"/><rect x="99" y="152" width="15" height="6" rx="2" fill="#f4f4f6"/><circle cx="106.5" cy="166" r="8" fill="#f0c6a0"/></g>
        </g>
      </svg>
    </div>
    <svg id="case" viewBox="0 0 44 38"><path d="M14 11V4h16v7" stroke="#2b1708" stroke-width="3" fill="none"/><rect x="2" y="10" width="40" height="27" rx="4" fill="url(#gC)"/><rect x="18" y="19" width="9" height="6" rx="1.5" fill="url(#gG)"/><path d="M5 31h34" stroke="rgba(255,255,255,.18)" stroke-dasharray="2 2"/></svg>
  </div>

  <main class="card" id="card">
    <div class="head">
      <img src="Golden%20RUDR%20Properties%20Emblem.png" alt="" onerror="this.remove()">
      <div><div class="brand">RUDR <i>PROPERTIES</i></div><span class="tag">YOUR PROPERTY PARTNER</span></div>
    </div>
    <p class="sub">ग्राहक लॉगिन: पूरी प्रॉपर्टी जानकारी देखने के लिए अपने ईमेल से लॉगिन करें।</p>
    <div>
      <form id="emailForm">
        <label for="email">ईमेल एड्रेस</label>
        <input id="email" type="email" autocomplete="email" placeholder="आपका ईमेल" required>
        <button id="sendButton" type="submit">OTP भेजें</button>
      </form>
      <form id="otpForm" hidden>
        <label for="otp">ईमेल पर आया 6 अंकों का OTP</label>
        <input id="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="123456" required>
        <button id="verifyButton" type="submit">OTP सत्यापित करें</button>
      </form>
    </div>
    <p id="message" role="status" aria-live="polite">लॉगिन सिस्टम शुरू हो रहा है...</p>
    <a class="back" id="backLink" href="./index.html">← वेबसाइट पर वापस जाएँ</a>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script>
/* ===== Intro: walk in, drop briefcase, pull the form in ===== */
(() => {
  if (window.parent !== window) document.documentElement.classList.add('embedded');
  const char = document.getElementById('char'), wrap = char.parentElement;
  const card = document.getElementById('card'), hand = document.getElementById('handcase'), cs = document.getElementById('case');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (!reduce) for (let i = 0; i < 16; i++) {
    const d = document.createElement('span'); d.className = 'dot';
    const s = 2 + Math.random() * 3;
    d.style.cssText = `left:${Math.random()*100}vw;bottom:${-Math.random()*10}vh;width:${s}px;height:${s}px;animation-duration:${9+Math.random()*10}s;animation-delay:${-Math.random()*14}s`;
    document.body.appendChild(d);
  }
  if (reduce) { hand.style.opacity = 0; cs.style.opacity = 1; card.classList.add('in'); return; }

  wrap.classList.add('walking');
  char.animate([{ transform: 'translateX(-58vw)' }, { transform: 'none' }], { duration: 2800, easing: 'cubic-bezier(.3,.1,.5,1)', fill: 'backwards' })
    .onfinish = () => {
      wrap.classList.remove('walking');
      hand.style.opacity = 0; cs.style.opacity = 1;
      cs.animate([{ transform: 'translateY(-120px) rotate(-12deg)' }, { transform: 'translateY(0) rotate(0)', offset: .7 }, { transform: 'translateY(-8px)', offset: .85 }, { transform: 'translateY(0)' }],
        { duration: 650, easing: 'ease-in' });
      setTimeout(() => wrap.classList.add('pull'), 650);
      setTimeout(() => card.classList.add('in'), 950);
      setTimeout(() => { wrap.classList.remove('pull'); wrap.classList.add('idle'); }, 2200);
    };
})();

/* ===== Login logic (Supabase OTP), unchanged ===== */
(() => {
  const form = document.getElementById('emailForm'), otpForm = document.getElementById('otpForm');
  const emailInput = document.getElementById('email'), otpInput = document.getElementById('otp');
  const message = document.getElementById('message');
  const sendButton = document.getElementById('sendButton'), verifyButton = document.getElementById('verifyButton');
  const card = document.getElementById('card');
  if (window.parent !== window) {
    const closeMe = () => window.parent.postMessage('rudr-close', '*');
    document.getElementById('backLink').addEventListener('click', e => { e.preventDefault(); closeMe(); });
    addEventListener('keydown', e => { if (e.key === 'Escape') closeMe(); });
  }

  function shake() { card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); }
  function showError(prefix, error) {
    shake();
    message.textContent = prefix + (error && error.message ? error.message : 'अज्ञात त्रुटि');
  }

  try {
    const cfg = window.RUDR_CONFIG;
    if (!cfg || !cfg.SUPABASE_URL || !cfg.SUPABASE_PUBLISHABLE_KEY) {
      throw new Error('config.js में Supabase URL या Publishable Key नहीं मिली।');
    }
    if (!window.supabase || !window.supabase.createClient) {
      throw new Error('Supabase लाइब्रेरी लोड नहीं हुई। इंटरनेट कनेक्शन जाँचें।');
    }
    const client = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_PUBLISHABLE_KEY);

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const email = emailInput.value.trim();
      if (!email) { message.textContent = 'कृपया अपना ईमेल डालें।'; return; }
      sendButton.disabled = true; sendButton.classList.add('loading');
      message.textContent = 'OTP भेजा जा रहा है...';
      try {
        const { error } = await client.auth.signInWithOtp({ email, options: { shouldCreateUser: true } });
        if (error) throw error;
        otpForm.hidden = false;
        message.textContent = 'OTP भेजने का अनुरोध सफल हुआ। अपना Inbox और Spam/Junk फ़ोल्डर जाँचें।';
        otpInput.focus();
      } catch (error) {
        showError('OTP नहीं भेजा जा सका: ', error);
      } finally {
        sendButton.disabled = false; sendButton.classList.remove('loading');
      }
    });

    otpForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      verifyButton.disabled = true; verifyButton.classList.add('loading');
      message.textContent = 'OTP सत्यापित किया जा रहा है...';
      try {
        const { error } = await client.auth.verifyOtp({ email: emailInput.value.trim(), token: otpInput.value.trim(), type: 'email' });
        if (error) throw error;
        message.textContent = 'लॉगिन सफल! वेबसाइट खोली जा रही है...';
        if (window.parent !== window) window.parent.location.reload(); else window.location.replace('./index.html');
      } catch (error) {
        showError('OTP सत्यापित नहीं हुआ: ', error);
      } finally {
        verifyButton.disabled = false; verifyButton.classList.remove('loading');
      }
    });

    message.textContent = 'ईमेल से लॉगिन करने के लिए तैयार।';
  } catch (error) {
    showError('लॉगिन सिस्टम शुरू नहीं हुआ: ', error);
    sendButton.disabled = true;
  }
})();
</script>
</body>
</html>
