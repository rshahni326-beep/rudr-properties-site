<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10110f">

  <title>Property Details | RUDR PROPERTIES</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <style>
    .details-page {
      max-width: 1100px;
      margin: 35px auto 70px;
      padding: 0 20px;
    }

    .back-home {
      display: inline-block;
      background: #171914;
      color: #fff;
      padding: 12px 18px;
      margin-bottom: 24px;
      font-size: 13px;
      text-decoration: none;
    }

    .details-layout {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 32px;
      align-items: start;
    }

    .gallery-main {
      position: relative;
      height: 390px;
      background: #10110f;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 10px;
    }

    .gallery-main img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .gallery-main video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #10110f;
    }

    .video-play-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 76px;
      height: 76px;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 2px solid #e0c477;
      border-radius: 50%;
      background: rgba(16, 17, 15, 0.90);
      color: #f3d78e;
      font-size: 32px;
      cursor: pointer;
      z-index: 3;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    }

    .video-play-button[hidden] {
      display: none;
    }

    .video-play-button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px;
    }

    .gallery-thumbs {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      margin-top: 12px;
      padding-bottom: 8px;
    }

    .gallery-thumbs button {
      position: relative;
      padding: 0;
      border: 2px solid transparent;
      background: #ddd;
      flex: 0 0 92px;
      height: 72px;
      overflow: hidden;
      cursor: pointer;
      border-radius: 5px;
    }

    .gallery-thumbs button.active {
      border-color: #c9a85d;
    }

    .gallery-thumbs img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .video-thumb {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #171914 !important;
      color: #f3d78e;
      font-size: 12px;
      font-weight: 700;
    }

    .details-info {
      background: #fff;
      padding: 26px;
      border: 1px solid #e9e5dc;
      border-radius: 10px;
    }

    .details-info h1 {
      font: 600 34px/1.2 "Playfair Display", Georgia, serif;
      margin: 8px 0 14px;
      color: #171914;
    }

    .details-price {
      font-size: 24px;
      color: #9b7837;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .details-location {
      color: #777;
      font-size: 14px;
      margin-bottom: 22px;
      line-height: 1.7;
    }

    .details-label {
      font-size: 10px;
      letter-spacing: 2px;
      color: #9b7837;
      font-weight: 700;
      margin-top: 22px;
    }

    .details-description {
      white-space: pre-wrap;
      color: #555;
      font-size: 14px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .details-facts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .details-fact {
      background: #f6f4ef;
      padding: 12px;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .details-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 25px;
    }

    .details-actions a {
      flex: 1 1 150px;
      text-align: center;
      padding: 13px 12px;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      border-radius: 6px;
    }

    .details-error {
      background: #fff;
      padding: 30px;
      text-align: center;
      border: 1px solid #e9e5dc;
      border-radius: 10px;
      overflow-wrap: anywhere;
    }

    .details-error h2 {
      font-family: "Playfair Display", Georgia, serif;
    }

    .details-error p {
      line-height: 1.7;
    }

    .error-code {
      margin-top: 14px;
      padding: 12px;
      background: #f6f4ef;
      color: #555;
      font-size: 12px;
      text-align: left;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    @media (max-width: 750px) {
      .details-layout {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .gallery-main {
        height: 280px;
      }

      .details-info h1 {
        font-size: 28px;
      }

      .details-page {
        margin-top: 22px;
        padding: 0 14px;
      }

      .details-info {
        padding: 20px;
      }

      .video-play-button {
        width: 68px;
        height: 68px;
        font-size: 29px;
      }
    }

    @media (max-width: 380px) {
      .details-facts {
        grid-template-columns: 1fr;
      }

      .details-info {
        padding: 16px;
      }
    }
  </style>
</head>

<body>

<header class="topbar">
  <a class="brand" href="./" aria-label="RUDR Properties home">
    <span class="brand-mark">R</span>
    <span>
      <strong>RUDR <i>PROPERTIES</i></strong>
      <small>YOUR PROPERTY PARTNER</small>
    </span>
  </a>
</header>

<main class="details-page">

  <a class="back-home" href="./">← Back to Home</a>

  <div id="detailsContent" aria-live="polite">
    <div class="details-error">
      <h2>Loading property…</h2>
      <p>Please wait.</p>
    </div>
  </div>

</main>

<footer>
  <a class="brand footer-brand" href="./">
    <span class="brand-mark">R</span>
    <span>
      <strong>RUDR <i>PROPERTIES</i></strong>
      <small>YOUR PROPERTY PARTNER</small>
    </span>
  </a>

  <p>
    Lucknow, Uttar Pradesh ·
    <a href="mailto:rshahni326@gmail.com">rshahni326@gmail.com</a>
  </p>

  <p class="copyright">
    © <span id="year"></span> RUDR PROPERTIES. All rights reserved.
  </p>
</footer>

<script>
(() => {
  'use strict';

  const cfg = window.RUDR_CONFIG || {};
  const root = document.getElementById('detailsContent');

  document.getElementById('year').textContent =
    new Date().getFullYear();

  function esc(value = '') {
    return String(value).replace(/[&<>"']/g, char => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    })[char]);
  }

  function isHttpsUrl(value) {
    try {
      const url = new URL(String(value || ''));
      return url.protocol === 'https:';
    } catch {
      return false;
    }
  }

  function getImages(value) {
    let items = [];

    if (Array.isArray(value)) {
      items = value;
    } else if (typeof value === 'string') {
      const raw = value.trim();

      if (raw.startsWith('[')) {
        try {
          const parsed = JSON.parse(raw);
          items = Array.isArray(parsed) ? parsed : [];
        } catch {
          items = raw.split(',').map(item => item.trim());
        }
      } else {
        items = raw.split(',').map(item => item.trim());
      }
    }

    return items
      .filter(item => typeof item === 'string' && isHttpsUrl(item))
      .map(item => item.trim());
  }

  function showError(title, message, technical = '') {
    root.replaceChildren();

    const box = document.createElement('div');
    box.className = 'details-error';

    const heading = document.createElement('h2');
    heading.textContent = title;

    const paragraph = document.createElement('p');
    paragraph.textContent = message;

    const homeParagraph = document.createElement('p');
    const homeLink = document.createElement('a');
    homeLink.className = 'text-link';
    homeLink.href = './';
    homeLink.textContent = '← Back to all properties';

    homeParagraph.appendChild(homeLink);
    box.append(heading, paragraph, homeParagraph);

    if (technical) {
      const errorBox = document.createElement('div');
      errorBox.className = 'error-code';
      errorBox.textContent = technical;
      box.appendChild(errorBox);
    }

    root.appendChild(box);
  }

  async function init() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    if (!id) {
      showError(
        'Property not selected',
        'Return to the homepage and tap View Details on a property.'
      );
      return;
    }

    if (
      !cfg.SUPABASE_URL ||
      !cfg.SUPABASE_PUBLISHABLE_KEY ||
      !window.supabase
    ) {
      showError(
        'Database connection not ready',
        'Check config.js and make sure the Supabase URL and publishable key are configured.'
      );
      return;
    }

    let timeoutId;

    try {
      const client = window.supabase.createClient(
        cfg.SUPABASE_URL,
        cfg.SUPABASE_PUBLISHABLE_KEY
      );

      const request = client
        .from('properties')
        .select('*')
        .eq('id', id)
        .maybeSingle();

      const timeout = new Promise((_, reject) => {
        timeoutId = setTimeout(() => {
          reject(new Error(
            'The database request timed out. Check your internet connection and Supabase settings.'
          ));
        }, 15000);
      });

      const result = await Promise.race([request, timeout]);

      clearTimeout(timeoutId);

      const { data, error } = result;

      if (error) {
        throw error;
      }

      if (!data) {
        showError(
          'Property not found',
          'This property could not be found. Return to the homepage and try opening it again.'
        );
        return;
      }

      const property = data;
      const images = getImages(property.image_urls);

      const video = isHttpsUrl(property.video_url)
        ? String(property.video_url).trim()
        : '';

      const media = images.map((src, index) => ({
        type: 'image',
        src,
        label: 'Property photo ' + (index + 1)
      }));

      if (video) {
        media.push({
          type: 'video',
          src: video,
          label: 'Property video'
        });
      }

      if (!media.length) {
        media.push({
          type: 'placeholder',
          src: '',
          label: 'No photo or video available'
        });
      }

      const waNumber = String(
        cfg.WHATSAPP_NUMBER || '918887036646'
      ).replace(/\D/g, '');

      const waText =
        'Hello RUDR PROPERTIES, I am interested in ' +
        (property.title || 'a property') +
        ' in ' +
        (property.location || 'Lucknow') +
        '. Please share details.';

      const waLink =
        'https://wa.me/' + waNumber +
        '?text=' + encodeURIComponent(waText);

      const email = cfg.CONTACT_EMAIL || 'rshahni326@gmail.com';

      const emailLink =
        'mailto:' + email +
        '?subject=' + encodeURIComponent(
          'Property enquiry: ' + (property.title || 'Property')
        );

      root.innerHTML = `
        <div class="details-layout">

          <section class="details-gallery" aria-label="Property media gallery">
            <div class="gallery-main" id="galleryMain"></div>
            <div class="gallery-thumbs" id="galleryThumbs"></div>
          </section>

          <section class="details-info">
            <p class="eyebrow">${esc(property.property_type || 'PROPERTY')}</p>

            <h1>${esc(property.title || 'Property')}</h1>

            <div class="details-price">
              ${esc(property.price || 'Price on request')}
            </div>

            <div class="details-location">
              ⌖ ${esc(property.location || 'Location on request')}
            </div>

            <div class="details-facts">
              <div class="details-fact">
                <strong>Property Type</strong><br>
                ${esc(property.property_type || 'Not specified')}
              </div>

              <div class="details-fact">
                <strong>Area</strong><br>
                ${esc(property.area || 'Contact for details')}
              </div>
            </div>

            <p class="details-label">PROPERTY DESCRIPTION</p>

            <div class="details-description">${esc(
              property.description ||
              'Please contact us for more details about this property.'
            )}</div>

            <div class="details-actions">
              <a class="card-primary"
                 href="${esc(waLink)}"
                 target="_blank"
                 rel="noopener noreferrer">
                Enquire on WhatsApp ↗
              </a>

              <a class="card-secondary" href="${esc(emailLink)}">
                Enquire on Email
              </a>
            </div>
          </section>

        </div>
      `;

      const main = document.getElementById('galleryMain');
      const thumbs = document.getElementById('galleryThumbs');

      function selectMedia(index) {
        const item = media[index];

        if (!item) return;

        main.replaceChildren();

        if (item.type === 'image') {
          const img = document.createElement('img');
          img.src = item.src;
          img.alt = item.label;
          img.loading = 'eager';
          main.appendChild(img);

        } else if (item.type === 'video') {
          const videoElement = document.createElement('video');

          videoElement.src = item.src;
          videoElement.controls = true;
          videoElement.playsInline = true;
          videoElement.preload = 'metadata';
          videoElement.setAttribute('aria-label', 'Property video');

          const playButton = document.createElement('button');

          playButton.type = 'button';
          playButton.className = 'video-play-button';
          playButton.textContent = '▶';
          playButton.setAttribute(
            'aria-label',
            'Play property video'
          );

          playButton.addEventListener('click', async () => {
            try {
              await videoElement.play();
            } catch (error) {
              console.error('Video playback error:', error);
              playButton.hidden = false;
            }
          });

          videoElement.addEventListener('play', () => {
            playButton.hidden = true;
          });

          videoElement.addEventListener('pause', () => {
            if (!videoElement.ended) {
              playButton.hidden = false;
            }
          });

          videoElement.addEventListener('ended', () => {
            playButton.hidden = false;
          });

          videoElement.addEventListener('error', () => {
            console.error('The property video could not be loaded.');
          });

          main.append(videoElement, playButton);

        } else {
          const span = document.createElement('span');
          span.textContent = item.label;
          span.style.color = '#fff';
          main.appendChild(span);
        }

        Array.from(thumbs.children).forEach((button, buttonIndex) => {
          button.classList.toggle('active', buttonIndex === index);
        });
      }

      media.forEach((item, index) => {
        const button = document.createElement('button');

        button.type = 'button';
        button.setAttribute('aria-label', item.label);

        if (item.type === 'image') {
          const img = document.createElement('img');
          img.src = item.src;
          img.alt = item.label;
          img.loading = 'lazy';
          button.appendChild(img);
        } else {
          button.classList.add('video-thumb');
          button.textContent =
            item.type === 'video' ? '▶ VIDEO' : 'NO PHOTO';
        }

        button.addEventListener('click', () => {
          selectMedia(index);
        });

        thumbs.appendChild(button);
      });

      selectMedia(0);

    } catch (error) {
      clearTimeout(timeoutId);

      console.error('Property details error:', error);

      showError(
        'Unable to load property',
        'The property details could not be loaded. Check your internet connection and try again.',
        error && error.message ? error.message : 'Unknown error'
      );
    }
  }

  init().catch(error => {
    console.error('Unexpected property page error:', error);

    showError(
      'Something went wrong',
      'Please return to the homepage and try again.',
      error && error.message ? error.message : 'Unknown error'
    );
  });
})();
</script>

</body>
</html>
